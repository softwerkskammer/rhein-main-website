<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Softwerkskammer Rhein-Main</title>
  <meta name="description" content="Offizielle Seite der Softwerkskammer Regionalgruppe Rhein-Main – Infos folgen in Kürze." />

  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b1220;
      --card: rgba(255, 255, 255, 0.06);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.72);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #7dd3fc;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7fb;
        --card: rgba(0, 0, 0, 0.04);
        --text: rgba(0, 0, 0, 0.88);
        --muted: rgba(0, 0, 0, 0.62);
        --border: rgba(0, 0, 0, 0.10);
        --accent: #0284c7;
      }
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 600px at 20% 10%, rgba(125, 211, 252, 0.20), transparent 60%),
                  radial-gradient(1000px 600px at 80% 20%, rgba(167, 139, 250, 0.16), transparent 55%),
                  var(--bg);
      color: var(--text);
    }

    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(720px, 100%);
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 16px 50px rgba(0,0,0,0.22);
      backdrop-filter: blur(8px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 14px;
      color: var(--muted);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(125, 211, 252, 0.12);
    }

    h1 {
      margin: 18px 0 10px 0;
      font-size: clamp(28px, 3.2vw, 40px);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .spacer { height: 16px; }

    footer {
      margin-top: 22px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--muted);
    }

    a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px dashed var(--border);
    }
    a:hover { border-bottom-style: solid; }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card" role="region" aria-label="Softwerkskammer Rhein-Main Hinweis">
      <div class="badge">
        <span class="dot" aria-hidden="true"></span>
        <span>Softwerkskammer – Regionalgruppe Rhein-Main</span>
      </div>

      <h1>Wir sind bald wieder da.</h1>
      <p>
        Hier wird es in Zukunft wieder Infos zu der Regionalgruppe <strong>Softwerkskammer Rhein-Main</strong> geben –
        z.&nbsp;B. zu Treffen, Formaten und Terminen.
      </p>

      <div class="spacer"></div>

      <p>
        Bis dahin: Danke fürs Vorbeischauen.
      </p>

      <footer>
        <span>Stand: <time datetime="2026-03-03">03.03.2026</time></span>
        <span>Kontakt: <a href="mailto:falk@jug-da.de">falk(at)jug-da.de</a></span>
      </footer>
    </section>
  </main>
</body>
</html>
